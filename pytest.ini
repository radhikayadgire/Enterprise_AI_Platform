[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    happy_path: Happy path test cases
    edge_case: Edge case test cases
    negative: Negative test cases
    e2e: End-to-end test cases
